version: "0.1"
registry_id: atlas_systems_phase14a
registry_status: additive_atlas_facing_registry
source_metadata:
  existing_registry: metadata/systems.yml
  disposition: historically_scoped_original_water_materials_registry_not_modified
  reason: The existing registry is useful source context but does not represent the later Phase 3–13 system packages.
namespace_rules:
  system_id_prefix: SYS-
  entity_id_prefix: ENT-
  retained_external_prefix: EXT-
  retained_reference_prefix: REF-
  relationship_id_prefix: REL-
  source_phase_namespace: phase<phase>.<artifact_stem>
  generation: deterministic_uppercase_slug_of_system_and_local_id
  local_ids: never_renumbered_or_replaced
  exact_identity: source_artifact_and_local_identifier_must_match
  system_mapping: interpretive_system_level_mapping_must_be_labelled
  external_mapping: retained_EXT_or_REF_identifier_is_not_a_physical_node
systems:
  - system_id: SYS-WATER
    preferred_label: Water / Hydrology
    atlas_display_label: Water & Hydrology
    aliases: [water, hydrology, hydrography, drinking water, watershed, Maumee–Lake Erie water system]
    broad_system_family: natural_environment
    originating_phases: ["1"]
    canonical_status: COMPLETE / VALIDATED
    primary_tables:
      - data/processed/networks/water_system_nodes.csv
      - data/processed/networks/water_system_edges.csv
      - data/processed/networks/huc12_routing_current.csv
      - data/processed/glasspunk_base.gpkg
    principal_maps: [01_water_baseline_2026, 02_maumee_nutrient_network, 03_black_swamp_drainage_system, 04_lake_erie_hab_intake_dependency, 05_water_system_2050_scenario]
    temporal_basis: 2026 factual/qualified water and hydrography context with earlier v0.1 and separate 2050 scenario products
    baseline_scenario_distinction: Historical v0.1 and current qualified hydrography remain distinct; fictional future objects remain separate.
    provenance_pointer: PROJECT_STATUS.md; docs/canon_status.md; reports/water_system_phase1_handoff.md
  - system_id: SYS-MATERIALS
    preferred_label: Geology / Minerals / Strategic Materials
