architecture:
  figure_title: Western Basin Systems Architecture
  figure_kind: conceptual_system_network_not_geographic_map
  note: System-level interfaces are qualitative and non-proportional; line presence does not imply causal effect, measured flow, or risk.
  interfaces:
    - [SYS-CLIMATE, SYS-WATER, physical_environment_context, documented_plus_inferred]
    - [SYS-WATER, SYS-BIOGEOCHEMISTRY, material_and_hydrologic_interface, documented_plus_inferred]
    - [SYS-BIOGEOCHEMISTRY, SYS-ECOLOGY, ecological_condition_interface, documented_plus_inferred]
    - [SYS-ECOLOGY, SYS-VECTOR-ECOLOGY, habitat_and_host_interface, documented_plus_inferred]
    - [SYS-VECTOR-ECOLOGY, SYS-INFECTIOUS-DISEASE, transmission_opportunity_interface, inferred]
    - [SYS-POPULATION, SYS-INFECTIOUS-DISEASE, aggregate_contact_and_surveillance_context, inferred]
    - [SYS-DATA, SYS-GOVERNANCE, observation_to_decision_interface, documented_plus_inferred]
    - [SYS-MATERIALS, SYS-FREIGHT, processing_and_logistics_interface, documented_plus_inferred]
    - [SYS-FREIGHT, SYS-ENERGY, industrial_and_gateway_dependency, inferred]
    - [SYS-ENERGY, SYS-DATA, continuity_and_operating_information, inferred]
    - [SYS-GOVERNANCE, SYS-EXPOSURE, role_and_control_interface, documented_plus_inferred]
    - [SYS-EXPOSURE, SYS-INFECTIOUS-DISEASE, environmental_health_boundary_context, intentionally_distinct]
