version: "0.1"
systems:
  water:
    system_id: SYS-WATER
    priority: 1
    baseline_year: 2026
    question: How does material move from Northwest Ohio land into Lake Erie and back into Toledo's drinking-water system?
    spatial_store: data/processed/glasspunk_base.gpkg
    node_table: data/processed/networks/water_system_nodes.csv
    edge_table: data/processed/networks/water_system_edges.csv
    reality_statuses: [real, historical, fictional]
    canon_statuses: [verified, inferred, scenario, experimental]
    scenario_years: [2026, 2035, 2050, 2075, 2100]
  materials:
    system_id: SYS-MATERIALS
    priority: 2
    baseline_year: 2026
    question: How do geology, processing, infrastructure, water, industry, and strategic technology connect through material relationships?
    spatial_store: data/processed/glasspunk_base.gpkg
    spatial_layer: materials_flow_nodes
    node_table: data/processed/networks/materials_system_nodes.csv
    edge_table: data/processed/networks/materials_system_edges.csv
    source_table: data/processed/networks/materials_system_sources.csv
    maps: [06_geology_resources_2026, 07_carbonate_materials_system, 08_beryllium_strategic_supply_chain, 09_luckey_elmore_materials_exposure_history]
    history_event_table: data/processed/history/materials_exposure_events.csv
    history_substance_table: data/processed/history/materials_exposure_substances.csv
    exposure_pathway_table: data/processed/history/materials_exposure_pathways.csv
    exposure_source_table: data/processed/history/materials_exposure_sources.csv
    reality_statuses: [real, historical]
    canon_statuses: [verified, inferred]
    relationship_bases: [observed, documented_supply_relationship, engineering_dependency, scientific_inference, supply_chain_inference, historical_documentation, regulatory_requirement]
    prohibited_in_phase_2b: [shipment_quantities, transport_routes, groundwater_flow, materials_corridor_geometry, future_scenarios]
    phase_2c_constraints: [luckey_legacy_not_current_production, elmore_processing_not_extraction, no_direct_luckey_elmore_flow, no_individual_exposure_finding, no_contamination_polygon, no_groundwater_plume, no_exposure_radius, no_map_10]
