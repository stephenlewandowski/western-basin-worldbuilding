<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 750" width="1280" height="750" role="img" aria-labelledby="title desc">
<title id="title">HUC-12 node balance residual diagnostic</title>
<desc id="desc">Per-constituent counts of absolute arithmetic node residuals in four display bins, with largest absolute node residual and aggregate residual. These bins are not scientific uncertainty thresholds. Run v01a_unit_pulse_strict.</desc>
