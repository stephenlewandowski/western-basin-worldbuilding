<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 900" width="1280" height="900" role="img" aria-labelledby="title desc">
<title id="title">Water, total nitrogen, and total phosphorus accounting dispositions</title>
<desc id="desc">Three separate constituent panels compare supplied local input with amounts not forwarded under an explicit assumption, amounts unrouted at unresolved links, and boundary export. Each panel has its own scale and unit. These are accounting dispositions, not measured storage, treatment, retention, or removal. Run v01a_unit_pulse_strict; Synthetic diagnostic inputs.</desc>
