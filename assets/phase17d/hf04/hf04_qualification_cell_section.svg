<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc">
<title id="title">HF-04 qualification cell and old crane hall section</title>
<desc id="desc">Qualitative section of a proposed vertical industrial exchange frontage inside retained brick and crane structure. An old crane lifts an opaque cell toward an empty berth. A protected optical qualification gallery and staffed acceptance desk sit above separate incoming, held, qualified, and outgoing residual bays. Heat and water services remain accessible, and outside freight is visible. This composite Toledo-derived 2075 architectural form is K, without measured dimensions or validated performance.</desc>
<defs>
 <pattern id="brick" width="44" height="24" patternUnits="userSpaceOnUse"><rect width="44" height="24" fill="#765747"/><path d="M0 0H44M0 12H44M0 0V12M22 12V24" stroke="#b69b82" stroke-width="1.4"/></pattern>
 <pattern id="screen" width="10" height="10" patternUnits="userSpaceOnUse"><rect width="10" height="10" fill="#c2d4ce"/><path d="M0 0V10" stroke="#6e928e" stroke-width="1"/></pattern>
 <pattern id="steel" width="12" height="12" patternUnits="userSpaceOnUse"><rect width="12" height="12" fill="#b2b6ad"/><path d="M0 12L12 0" stroke="#88918b" stroke-width="1"/></pattern>
 <style>text{font-family:Arial,Helvetica,sans-serif;fill:#263f44}.eyebrow{font-size:17px;letter-spacing:2px}.heading{font-size:34px;font-weight:600}.label{font-size:19px;font-weight:600}.small{font-size:16px}.note{font-size:15px;fill:#53686a}.leader{fill:none;stroke:#617673;stroke-width:1.5}.frame{fill:none;stroke:#455c5e;stroke-width:8}.dashed{fill:none;stroke:#9a7850;stroke-width:2.5;stroke-dasharray:8 6}.heat{fill:none;stroke:#ae7141;stroke-width:4}.water{fill:none;stroke:#3d8194;stroke-width:4}</style>
</defs>
