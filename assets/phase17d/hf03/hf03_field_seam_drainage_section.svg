<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc">
<title id="title">HF-03 field, bio-ag seam, drainage and wetland qualitative section</title>
<desc id="desc">A composite Maumee-derived 2075 scenario and K architectural form. From left to right are an unroofed productive field; selective propagation bay; stopped field machine at an open service berth; opaque contained processing and qualification; separate hold, reject and outward access; old drainage control and ordinary ditch water; and a distinct reed wetland edge. External supplies enter by road. A farmer maintains the gate, and an empty seam segment remains isolated. The diagram has display coordinates only and claims no measured geometry, treatment, nutrient capture, yield or ecological improvement.</desc>
<defs>
  <pattern id="soil" width="24" height="16" patternUnits="userSpaceOnUse"><rect width="24" height="16" fill="#a88762"/><path d="M2 5l5 2m9 5l5-1" stroke="#705b43" stroke-width="2"/></pattern>
  <pattern id="reeds" width="22" height="42" patternUnits="userSpaceOnUse"><path d="M3 42L8 7m2 35L18 14m-6 28l-2-21" stroke="#63815e" stroke-width="3"/><ellipse cx="8" cy="8" rx="3" ry="6" fill="#8d744d"/></pattern>
  <style>text{font-family:Arial,Helvetica,sans-serif;fill:#243e43}.eyebrow{font-size:17px;letter-spacing:2px;font-weight:700}.heading{font-size:36px;font-weight:700}.label{font-size:19px;font-weight:700}.small{font-size:16px}.note{font-size:15px;fill:#51666a}.guide{stroke:#6d8582;stroke-width:2;fill:none}.segment{stroke:#425e60;stroke-width:4}.old{stroke:#6a675c;stroke-width:5}</style>
</defs>
