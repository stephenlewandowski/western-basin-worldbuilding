 <pattern id="screen" width="15" height="15" patternUnits="userSpaceOnUse"><rect width="15" height="15" fill="#d8e9e6" fill-opacity=".7"/><path d="M3 0V15" stroke="#8eb9bb" stroke-width="2" opacity=".7"/></pattern>
