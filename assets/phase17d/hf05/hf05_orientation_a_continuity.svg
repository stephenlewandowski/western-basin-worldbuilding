<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="920" viewBox="0 0 1600 920" role="img" aria-labelledby="title desc">
<title id="title">Reading Hall orientation A — continuity relationships</title>
<desc id="desc">Qualitative plan for visual continuity, with left arrival and right instrument spine. The public counter faces the open reading floor. A separate left field-return vestibule splits closed sample custody from dry recorder checking. The ground exchange berth lies under the tall right tier and connects to a rear service gallery. Beyond the tall end, opaque compute and plant remain separate from dry preservation. Arrows indicate human routes, not scientific flows or measured clearance.</desc>
